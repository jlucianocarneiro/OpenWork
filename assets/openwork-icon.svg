<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B3A5C"/>
      <stop offset="100%" stop-color="#0f2440"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#4a8eff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4a8eff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="inner-glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Subtle top glow -->
  <rect x="16" y="16" width="480" height="240" rx="96" ry="96" fill="url(#glow)"/>

  <!-- Central node ring (the "O" of Open) -->
  <circle cx="256" cy="240" r="88" fill="none" stroke="#e4e6ed" stroke-width="14" opacity="0.95"/>

  <!-- AI spark inside the O — three converging lines to a center point -->
  <circle cx="256" cy="240" r="6" fill="#4a8eff"/>
  <line x1="256" y1="240" x2="220" y2="195" stroke="#4a8eff" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <line x1="256" y1="240" x2="292" y2="195" stroke="#4a8eff" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <line x1="256" y1="240" x2="256" y2="285" stroke="#4a8eff" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <!-- Outer dots -->
  <circle cx="220" cy="195" r="8" fill="#4a8eff" opacity="0.9"/>
  <circle cx="292" cy="195" r="8" fill="#4a8eff" opacity="0.9"/>
  <circle cx="256" cy="285" r="8" fill="#4a8eff" opacity="0.9"/>

  <!-- Orbiting small nodes (network/open concept) -->
  <circle cx="160" cy="200" r="10" fill="#e4e6ed" opacity="0.5"/>
  <line x1="168" y1="206" x2="210" y2="226" stroke="#e4e6ed" stroke-width="2.5" opacity="0.3"/>

  <circle cx="352" cy="200" r="10" fill="#e4e6ed" opacity="0.5"/>
  <line x1="344" y1="206" x2="302" y2="226" stroke="#e4e6ed" stroke-width="2.5" opacity="0.3"/>

  <circle cx="256" cy="360" r="10" fill="#e4e6ed" opacity="0.5"/>
  <line x1="256" y1="350" x2="256" y2="330" stroke="#e4e6ed" stroke-width="2.5" opacity="0.3"/>

  <!-- "OpenWork" text -->
  <text x="256" y="430" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="52" font-weight="700" fill="#e4e6ed" letter-spacing="2">
    <tspan fill="#e4e6ed">Open</tspan><tspan fill="#4a8eff">Work</tspan>
  </text>
</svg>
